name: CI/CD

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

# Cancel superseded CI runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Match the VPS Node.js version.
          node-version: 20.19.5
          cache: npm

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Hostinger VPS
    needs: ci

    # Deploy only after successful CI on main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    environment: production

    # Never run two deployments at once.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Pull, build and restart on the VPS
        uses: appleboy/ssh-action@v1.2.0

        env:
          APP_DIR: ${{ vars.APP_DIR }}
          PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: APP_DIR,PM2_APP_NAME
          command_timeout: 20m

          script: |
            set -e

            # Load NVM for non-interactive SSH shell.
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            echo "Node version:"
            node -v

            echo "NPM version:"
            npm -v

            cd "$APP_DIR"

            echo "Fetching latest main..."
            git fetch --prune origin main

            echo "Resetting to origin/main..."
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building Next.js..."
            npm run build

            echo "Restarting PM2..."

            if pm2 describe "$PM2_APP_NAME" > /dev/null 2>&1; then
              pm2 reload "$PM2_APP_NAME" --update-env
            else
              pm2 start npm --name "$PM2_APP_NAME" -- start
            fi

            pm2 save

            echo "Deployment completed successfully."